name: simplestonks
title: simpleStonks
base: core24
version: "1.4.2"
icon: internal/assets/icon.svg # bundled into the binary too; see internal/assets
license: MIT
summary: Bare-bones stock tracker widget
# Store listing links, synced from the snap on upload. The listing category
# (Finance) and the screenshots are store-side only: set them once in the
# snapcraft.io listing editor and they persist across revisions.
website: https://github.com/MarioStoilov/simpleStonks
contact: https://github.com/MarioStoilov/simpleStonks/issues
issues: https://github.com/MarioStoilov/simpleStonks/issues
source-code: https://github.com/MarioStoilov/simpleStonks
description: |
  simpleStonks shows a configurable list of stock indexes and tickers and charts
  their movement, Yahoo Finance style, in a frameless translucent widget-style
  window. The tracked list is editable from the UI and persisted along with
  other settings.

  What's new in 1.4.2:

  - Reordering symbols on the home grid now reorders the detail view's
    sidebar immediately instead of after a restart.
  - The detail view's headline price and its sidebar tile now always show
    the same price: the headline keeps ticking on every chart range, and
    both are fed by one shared request.

grade: stable
confinement: strict

apps:
  simplestonks:
    command: bin/simplestonks
    # The gnome extension supplies the generic desktop plumbing (fonts, XDG,
    # themes); the Qt 6 runtime itself is staged below.
    extensions: [gnome]
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins
    plugs:
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl

parts:
  simplestonks:
    plugin: go
    source: .
    build-snaps:
      - go/1.23/stable
    build-packages:
      - pkg-config
      - gcc
      - qt6-base-dev
      - qt6-tools-dev # QUiLoader: the UI is loaded from Qt Designer forms
    stage-packages:
      - libqt6widgets6 # pulls the Qt 6 core/gui runtime (includes the xcb platform plugin)
      - qt6-wayland # Wayland platform plugin
      - libqt6svg6 # SVG image plugin (About-dialog logo); ships the plugin on 24.04
      - libqt6uitools6 # loads the embedded .ui forms at runtime
      - qt6-gtk-platformtheme # match the desktop theme where available
    # Build explicitly instead of the plugin default so the release binary is
    # stripped (-s -w) — the unstripped cgo/Qt binary alone is ~100 MB.
    override-build: |
      go build -trimpath -ldflags="-s -w" -o "$CRAFT_PART_INSTALL/bin/simplestonks" ./cmd/simplestonks
